domain_selectors:
  laws-lois.justice.gc.ca:
    content_selector:
      - ".lawBody"
      - ".regulation-content"
      - "main"
      - "[id='main-content']"
    remove_selector:
      - "nav"
      - "header"
      - "footer"
      - ".asideContainer"
      - ".topContainer"
      - ".bottomNav"
    heading_selector: ["h1", "h2", "h3", "h4", "h5", "h6"]
    paragraph_selector: "p"

  www.tbs-sct.canada.ca:
