model:
  name: "gemma4:31b"
  specialist_name: "gemma4:e4b"
  orchestrator_host: "http://127.0.0.1:11436"
  specialist_host: "http://127.0.0.1:11435"
  orchestrator_auth_header: null
  specialist_auth_header: null
  temperature: 0.2    # Low temperature for policy accuracy
  num_ctx: 32768      # Gives specialists room for full policy content
  top_p: 0.9
  think: false
  orchestrator_num_predict: 1800
  specialist_num_predict: 1000
  route_with_llm: false

server:
  host: "0.0.0.0"
  port: 8000

cache:
  ttl_hours: 168       # 7 days default cache TTL
  max_size_mb: 500

storage:
  data_dir: "data"
  database_url: null

logging:
  level: "INFO"
  file: "logs/system.log"

parsing:
  enabled: true
  spacy_model: "en_core_web_sm"
  spacy_model_version: "3.7.1"
  query_entity_threshold: 2
  validate_mode_threshold: 5
  max_graph_results: 20
  warmup_on_startup: false
  teacher_loop_enabled: true
  validation_rules:
    RULE-01:
      enabled: true
    RULE-02:
      enabled: true
    RULE-03:
      enabled: true
      section_ref_regex: '(s\.\s*\d+(\.\d+)*|[Ss]ection\s+\d+(\.\d+)*|[Aa]rticle\s+\d+)'
    RULE-04:
      enabled: true
    RULE-05:
      enabled: true
