services:
  - type: web
    name: hr-policy-bot-web-app
    runtime: python
    branch: web-app
    plan: starter
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: hr-policy-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_DATA_DIR
        value: /var/data
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: PARSING_ENABLED
        value: "false"
      - key: PARSING_TEACHER_LOOP_ENABLED
        value: "false"
      - key: OLLAMA_ORCHESTRATOR_MODEL
        value: gemma4:31b
      - key: OLLAMA_SPECIALIST_MODEL
        value: gemma4:e4b
      - key: OLLAMA_ORCHESTRATOR_HOST
        value: https://veto-faceless-grime.ngrok-free.dev/orchestrator
      - key: OLLAMA_SPECIALIST_HOST
        value: https://veto-faceless-grime.ngrok-free.dev/specialist
      - key: OLLAMA_AUTH_HEADER
        sync: false
