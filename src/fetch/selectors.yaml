      - "header"
      - "footer"
      - "#wb-info"
      - ".pagedetails"
      - ".wb-sldr"
      - ".footer"
    heading_selector: ["h1", "h2", "h3", "h4"]
    paragraph_selector: "p"

  www.canada.ca:
    content_selector:
      - "main"
      - ".mwsgeneric-base-html"
      - "[id='main-content']"
    remove_selector:
      - "nav"
      - "header"
      - "footer"
      - "#wb-info"
      - ".pagedetails"
      - ".header-site"
    heading_selector: ["h1", "h2", "h3", "h4", "h5"]
    paragraph_selector: "p"

  www.njc-cnm.gc.ca:
